<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไม่มีการเชื่อมต่ออินเทอร์เน็ต - OrgChat AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            font-family: 'Inter', 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        .offline-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            padding: 2.5rem;
            max-width: 28rem;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon-wrap {
            width: 4.5rem;
            height: 4.5rem;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }
        p {
            color: #94a3b8;
            font-size: 0.925rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn-retry {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 0.875rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }
        .btn-retry:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }
        .btn-retry:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-wrap">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>
        <h1>ขาดการเชื่อมต่ออินเทอร์เน็ต</h1>
        <p>ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ OrgChat AI ได้ในขณะนี้ กรุณาตรวจสอบสัญญาณ Wi-Fi หรือ Cellular ของคุณแล้วลองใหม่อีกครั้ง</p>
        <button class="btn-retry" onclick="window.location.reload()">ลองเชื่อมต่อใหม่อีกครั้ง</button>
    </div>
</body>
</html>
