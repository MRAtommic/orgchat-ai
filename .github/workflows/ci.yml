name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System packages (OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-tha

      - name: Install dependencies
        run: pip install --prefer-binary -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q webai

      - name: Run test suite
        working-directory: webai
        env:
          APP_ENV: testing
          FLASK_SECRET_KEY: ci-only-secret
          SECRET_KEY: ci-only-secret
          BASE_URL: http://localhost:5000
          DB_PATH: ci_test.db
        run: python run_tests.py
